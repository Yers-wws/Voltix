<!DOCTYPE html><html lang="en"><head><title>Catalog | Voltix</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body data-page="products">
<header class="site-header"><div class="wrap nav">
  <a class="logo" href="index.html">Volt<span>ix</span></a>
  <nav aria-label="Main"><a href="index.html">Home</a><a href="products.html" aria-current="page">Catalog</a><a href="cart.html">Cart <span class="pill" data-count="cart">0</span></a></nav>
  <button id="themeBtn" class="icon-btn" aria-label="Switch light or dark theme">🌙</button>
</div></header>
<main class="wrap block">
  <h1>Catalog</h1>
  <div class="toolbar">
    <div><label for="search">Search</label><input id="search" type="search" placeholder="Name, brand or tag"></div>
    <div><label for="category">Category</label><select id="category"><option value="">All categories</option></select></div>
    <div><label for="brand">Brand</label><select id="brand"><option value="">All brands</option></select></div>
    <div><label for="sort">Sort by</label><select id="sort"><option value="rating">Highest rated</option><option value="priceAsc">Price: low to high</option><option value="priceDesc">Price: high to low</option><option value="discount">Biggest discount</option><option value="name">Name A to Z</option></select></div>
    <div><label for="maxPrice">Max price: <output id="maxOut"></output></label><input id="maxPrice" type="range" min="0" max="100" step="10" value="100"></div>
    <div class="checks"><label class="check"><input id="inStock" type="checkbox"> In stock only</label><label class="check"><input id="onlyWish" type="checkbox"> Wishlist only</label></div>
  </div>
  <p id="count" class="muted" aria-live="polite"></p>
  <div id="grid" class="grid"></div>
</main>
<footer class="site-footer"><div class="wrap">Voltix, © <span id="year"></span>. Product data from DummyJSON. This is a student demo store: no real payments. Your cart and wishlist stay in this browser.</div></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="modal" aria-label="Product details"></dialog></body></html>
